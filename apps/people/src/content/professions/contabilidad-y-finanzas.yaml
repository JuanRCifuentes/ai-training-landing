name: Contabilidad y finanzas
order: 2
title: IA para contabilidad y finanzas, desde cero
description: Curso práctico para contadores, contables y profesionales de finanzas que empiezan con la IA. Conciliaciones, Excel y ERP, impuestos, presupuestos e informes, con los datos protegidos.
summary: Conciliaciones, Excel y ERP, impuestos, presupuestos e informes, sin exponer datos confidenciales.
lead: Para contadores, contables y profesionales de finanzas que todavía no usan la IA. Trabajas con las tareas que más tiempo te quitan cada mes, y aprendes qué datos no debes compartir nunca con una IA.
audience: Contadores, contables y profesionales de finanzas que empiezan a usar la IA.
reviewer: Un profesional de las finanzas
tools:
  - Copilot en Excel
  - ChatGPT, Claude o Gemini
  - Las exportaciones de tu ERP
tasks:
  - title: Conciliación bancaria
    body: Cruzas extractos con movimientos contables y la IA te ayuda a explicar las diferencias que quedan.
  - title: Excel y exportaciones del ERP
    body: Fórmulas, tablas dinámicas y limpieza de datos exportados, con cada paso explicado.
  - title: Impuestos
    body: Preparas resúmenes y listas de comprobación para las declaraciones, y contrastas cada dato con la fuente oficial.
  - title: Presupuestos y tesorería
    body: Comparas el real con el presupuesto, preparas previsiones de tesorería y explicas cada desviación.
  - title: Informes
    body: Conviertes cierres y análisis en informes claros, con cada cifra trazable a su origen.
  - title: Correos a clientes
    body: Pides documentación, envías recordatorios y explicas resultados en lenguaje claro.
weeks:
  - title: Fundamentos y datos confidenciales
    goal: Entiendes cómo funciona la IA, dónde se equivoca con las cifras y qué datos no debes compartir nunca.
    outcome: Tus reglas de datos, claras y por escrito.
  - title: Excel y el ERP
    goal: Usas la IA para fórmulas, limpieza de datos y análisis de exportaciones.
    outcome: Tus plantillas e instrucciones reutilizables para Excel.
  - title: Conciliaciones, cierre y análisis
    goal: Usas la IA en conciliaciones, cierres y análisis de desviaciones, revisando cada paso.
    outcome: Tu procedimiento de cierre y análisis con IA.
  - title: Impuestos, informes y clientes
    goal: Preparas resúmenes fiscales, informes y correos a clientes, comprobando cada dato contra su fuente.
    outcome: Tu biblioteca de informes, correos y listas de comprobación.
objection:
  question: ¿Y la confidencialidad de mis datos y los de mis clientes?
  answer: Es lo primero que vemos. En la primera semana aprendes qué herramientas y planes no usan tus datos para entrenar modelos, cómo anonimizar antes de pedir ayuda y qué no debes pegar nunca, como identificadores fiscales, cuentas bancarias o datos personales. Practicas con datos de ejemplo, no con datos reales.
forWho:
  - Contadores, contables y profesionales de finanzas que todavía no usan la IA.
  - Quien pasa muchas horas en Excel, conciliaciones, informes y correos repetitivos.
  - Profesionales independientes que quieren ganar tiempo sin arriesgar los datos de sus clientes.
notForWho:
  - Quien quiere automatizar la contabilidad de principio a fin con agentes. Eso es IA avanzada.
  - Quien espera que la IA presente declaraciones o cierre el mes sola. El criterio profesional sigue siendo tuyo.
faq:
  - question: ¿Funciona con mi ERP?
    answer: Trabajas con lo que tu ERP exporta, como hojas de cálculo, informes y extractos. No hace falta integrar nada.
  - question: ¿Sirve en España y en Colombia?
    answer: Sí. Los ejercicios se adaptan a la normativa y los formatos de cada país, y siempre se contrastan con la fuente oficial.
  - question: ¿La IA puede equivocarse con las cifras?
    answer: Sí, y con aparente seguridad. Por eso cada ejercicio incluye comprobar el resultado contra los datos de origen.
