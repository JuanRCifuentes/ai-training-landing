name: Contabilidad
order: 2
title: IA para contadores, desde cero
description: Curso práctico para contadores y contables que empiezan con la IA. Conciliaciones, Excel y ERP, impuestos y correos a clientes, con los datos de tus clientes protegidos.
summary: Conciliaciones, Excel y ERP, impuestos y correos a clientes, sin exponer los datos de tus clientes.
lead: Para contadores y contables que todavía no usan la IA. Trabajas con las tareas que más tiempo te quitan cada mes, y aprendes qué datos de tus clientes no debes compartir nunca con una IA.
audience: Contadores y contables que empiezan a usar la IA.
tools:
  - Copilot en Excel
  - ChatGPT, Claude o Gemini
  - Las exportaciones de tu ERP
tasks:
  - title: Conciliación bancaria
    body: Cruzas extractos con movimientos contables y la IA te ayuda a explicar las diferencias que quedan.
  - title: Excel y exportaciones del ERP
    body: Fórmulas, tablas dinámicas y limpieza de datos exportados, con cada paso explicado.
  - title: Impuestos
    body: Preparas resúmenes y listas de comprobación para las declaraciones, y contrastas cada dato con la fuente oficial.
  - title: Correos a clientes
    body: Pides documentación, envías recordatorios y explicas resultados en lenguaje claro.
  - title: Cierre de mes
    body: Ordenas las tareas del cierre, detectas partidas raras y preparas notas para tus clientes.
weeks:
  - title: Fundamentos y datos de clientes
    goal: Entiendes cómo funciona la IA, dónde se equivoca y qué datos de tus clientes no debes compartir nunca.
    outcome: Tus reglas de datos, claras y por escrito.
  - title: Excel y el ERP
    goal: Usas la IA para fórmulas, limpieza de datos y análisis de exportaciones.
    outcome: Tus plantillas e instrucciones reutilizables para Excel.
  - title: Conciliaciones y cierre
    goal: Usas la IA en conciliaciones y cierres, revisando cada paso.
    outcome: Tu procedimiento de conciliación con IA.
  - title: Impuestos y clientes
    goal: Preparas resúmenes fiscales y correos a clientes, comprobando cada dato contra su fuente.
    outcome: Tu biblioteca de correos y listas de comprobación.
objection:
  question: ¿Y la confidencialidad de mis clientes?
  answer: Es lo primero que vemos. En la primera semana aprendes qué herramientas y planes no usan tus datos para entrenar modelos, cómo anonimizar antes de pedir ayuda y qué no debes pegar nunca, como identificadores fiscales, cuentas bancarias o datos personales. Practicas con datos de ejemplo, no con los de tus clientes.
forWho:
  - Contadores y contables que todavía no usan la IA.
  - Quien pasa muchas horas en Excel, conciliaciones y correos repetitivos.
  - Profesionales independientes que quieren ganar tiempo sin arriesgar los datos de sus clientes.
notForWho:
  - Quien quiere automatizar la contabilidad de principio a fin con agentes. Eso es IA avanzada.
  - Quien espera que la IA presente declaraciones o cierre el mes sola. El criterio profesional sigue siendo tuyo.
faq:
  - question: ¿Funciona con mi ERP?
    answer: Trabajas con lo que tu ERP exporta, como hojas de cálculo, informes y extractos. No hace falta integrar nada.
  - question: ¿Sirve en España y en Colombia?
    answer: Sí. Los ejercicios se adaptan a la normativa y los formatos de cada país, y siempre se contrastan con la fuente oficial.
  - question: ¿La IA puede equivocarse con los impuestos?
    answer: Sí, y con aparente seguridad. Por eso cada ejercicio fiscal incluye comprobar la normativa y revisar el resultado tú mismo.
