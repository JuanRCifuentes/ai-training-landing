name: Recursos humanos
order: 3
title: IA aplicada a recursos humanos
description: Formación desde cero para equipos de personas. Ofertas de empleo, selección, políticas internas y bienvenida, con criterio sobre datos personales y decisiones que afectan a personas.
summary: Ofertas de empleo, selección, políticas internas y bienvenida, con criterio sobre los datos personales.
lead: Un programa para equipos de personas que empiezan a usar la IA. Se trabaja con sus documentos y procesos reales, con especial cuidado en los datos personales y en las decisiones que afectan a candidatos y empleados.
audience: Equipos de recursos humanos y selección que empiezan a usar la IA.
tools:
  - ChatGPT, Claude o Gemini
  - Copilot en Word y Outlook
  - Su plataforma de selección o de RR. HH.
tasks:
  - title: Ofertas de empleo
    body: Redactar descripciones de puesto claras, inclusivas y coherentes con la marca de la organización.
  - title: Selección
    body: Preparar guiones de entrevista, criterios de evaluación y resúmenes, sin delegar la decisión.
  - title: Políticas internas
    body: Redactar y actualizar políticas, y convertirlas en preguntas frecuentes para la plantilla.
  - title: Bienvenida
    body: Preparar planes de incorporación, materiales para el primer día y respuestas a las dudas habituales.
  - title: Comunicación interna
    body: Escribir anuncios, encuestas y resúmenes de resultados en un tono cercano.
weeks:
  - title: Fundamentos y datos personales
    goal: Entender la IA y qué datos de candidatos y empleados no deben introducirse en ella.
    outcome: Reglas de uso de datos personales para el equipo.
  - title: Ofertas y selección
    goal: Redactar ofertas y preparar entrevistas con IA, revisando los sesgos de cada texto.
    outcome: Plantillas de ofertas y guiones de entrevista revisados.
  - title: Políticas y documentación
    goal: Redactar, resumir y actualizar políticas internas con la IA.
    outcome: Una política real del equipo, reescrita y con sus preguntas frecuentes.
  - title: Bienvenida y comunicación
    goal: Montar un plan de incorporación y los materiales de comunicación interna.
    outcome: Un plan de bienvenida listo para la próxima incorporación.
objection:
  question: ¿Podemos usar la IA en la selección de personal?
  answer: Para preparar y redactar, sí. Para decidir sobre personas, no. El Reglamento Europeo de Inteligencia Artificial considera de alto riesgo los sistemas que filtran candidatos o evalúan a empleados, y la normativa de protección de datos limita qué información personal puede tratarse. En el programa, la IA ayuda a escribir ofertas, guiones y resúmenes, y la evaluación y la decisión siguen siendo de su equipo.
forWho:
  - Equipos de RR. HH. y selección que todavía no usan la IA.
  - Responsables de personas que quieren introducir la IA en la organización con reglas claras.
  - Equipos con mucha carga de documentación, ofertas y comunicación interna.
notForWho:
  - Quien busca un sistema que filtre o puntúe candidatos de forma automática.
  - Equipos que ya automatizan procesos completos con agentes. Eso es IA avanzada.
faq:
  - question: ¿Es compatible con el RGPD?
    answer: El programa enseña a trabajar sin introducir datos personales identificables y a revisar las condiciones de cada herramienta. La base jurídica de cada tratamiento la define su organización.
  - question: ¿Puede RR. HH. liderar después la adopción en toda la organización?
    answer: Sí, y es un buen punto de partida. El módulo Adopción en equipos completa este programa para quien vaya a liderar ese despliegue.
  - question: ¿Necesitamos una plataforma concreta?
    answer: No. Se trabaja con asistentes generales y con los documentos que el equipo ya usa.
