name: Producto y gestión
order: 4
title: IA aplicada a la gestión de producto y de equipos
description: Formación desde cero para product owners, responsables de proyecto y mánagers. Historias de usuario, priorización, reuniones, informes e investigación de usuarios con IA.
summary: Historias de usuario, priorización, reuniones e informes, con la decisión siempre en el equipo.
lead: Un programa para product owners, responsables de proyecto y mánagers que empiezan a usar la IA. Se trabaja con su backlog, sus reuniones y sus informes reales, y con criterio para decidir qué se delega en la IA y qué no.
audience: Product owners, responsables de proyecto y mánagers que empiezan a usar la IA.
reviewer: Un profesional de la gestión de producto
tools:
  - ChatGPT, Claude o Gemini
  - Copilot en Microsoft 365
  - Jira, Linear, Asana o la herramienta del equipo
tasks:
  - title: Historias de usuario
    body: Redactar historias y criterios de aceptación a partir de notas, peticiones o conversaciones.
  - title: Priorización
    body: Ordenar el backlog con criterios explícitos y explicar el porqué de cada decisión.
  - title: Reuniones
    body: Preparar agendas, resumir decisiones y repartir las tareas de seguimiento.
  - title: Informes de estado
    body: Convertir el avance del equipo en informes claros para la dirección.
  - title: Investigación de usuarios
    body: Resumir entrevistas y comentarios de clientes en temas y oportunidades.
weeks:
  - title: Fundamentos e información de la empresa
    goal: Entender la IA, sus errores habituales y qué información de la empresa no debe compartirse.
    outcome: Reglas de uso de la IA para el equipo.
  - title: Backlog e historias
    goal: Redactar historias y criterios de aceptación, y priorizar el backlog con IA.
    outcome: Plantillas de historias y criterios listas para el equipo.
  - title: Reuniones y seguimiento
    goal: Preparar y resumir reuniones, y hacer seguimiento de decisiones y tareas.
    outcome: Un flujo de actas y seguimiento que el equipo usa cada semana.
  - title: Informes y usuarios
    goal: Preparar informes de estado y síntesis de investigación de usuarios.
    outcome: Un informe de estado y una síntesis de usuarios hechos con datos reales.
objection:
  question: ¿La IA va a decidir por el equipo?
  answer: No. La IA ordena información, propone y redacta, pero priorizar y decidir sigue siendo responsabilidad de las personas. El programa enseña a pedirle que justifique cada propuesta, a contrastarla con los datos del equipo y a no compartir información confidencial de la empresa.
forWho:
  - Product owners y responsables de proyecto que todavía no usan la IA.
  - Mánagers que dedican mucho tiempo a reuniones, informes y seguimiento.
  - Equipos que quieren una forma común de usar la IA en su trabajo.
notForWho:
  - Quien busca automatizar la gestión de proyectos de principio a fin con agentes. Eso es IA avanzada.
  - Quien espera que la IA sustituya la conversación con el equipo o con los clientes.
faq:
  - question: ¿Funciona con Jira, Linear o Asana?
    answer: Se trabaja con lo que esas herramientas exportan o con texto copiado de ellas. No hace falta integrar nada.
  - question: ¿Hace falta saber programar?
    answer: No.
  - question: ¿Sirve para equipos que no son de software?
    answer: Sí. Los ejercicios se adaptan a cualquier equipo que gestione proyectos.
